name: Deploy Virwo Frontend to VPS

on:
  # Allows manual deployment from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Commit Hash, Branch, or Tag to deploy'
        required: true
        default: 'main'
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'staging'
      api_url:
        description: 'NEXT_PUBLIC_API_URL (baked into Next.js client bundle)'
        required: false
        default: 'http://virwo.learnica.net/backend'

jobs:
  build-and-push:
    name: Build & Push Docker Image (Cloud Runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_name: ${{ steps.meta.outputs.image_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Extract Commit SHA & Image Tags
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ENV_NAME="${{ github.event.inputs.environment || 'production' }}"
          IMAGE_BASE="ghcr.io/${{ github.repository }}"
          IMAGE_BASE_LOWER=$(echo "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${ENV_NAME}-${COMMIT_SHA}"
          IMAGE_NAME="${IMAGE_BASE_LOWER}:${IMAGE_TAG}"
          LATEST_NAME="${IMAGE_BASE_LOWER}:${ENV_NAME}"

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "latest_name=$LATEST_NAME" >> $GITHUB_OUTPUT
          echo "Target image: $IMAGE_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.event.inputs.api_url || 'http://virwo.learnica.net/backend' }}
          tags: |
            ${{ steps.meta.outputs.image_name }}
            ${{ steps.meta.outputs.latest_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy Container on VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_ENV: ${{ secrets.PROD_ENV_FILE }}
          STAGE_ENV: ${{ secrets.STAGE_ENV_FILE }}
          TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PROD_ENV,STAGE_ENV,TARGET_ENV,IMAGE_NAME,GHCR_USER,GHCR_PAT
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 Starting Virwo Frontend deployment on VPS for environment: $TARGET_ENV..."

            ROOT_DIR="/var/www/virwo/frontend"
            PROJECT_NAME="virwo-frontend"
            ENV_CONTENT="$PROD_ENV"

            if [ "$TARGET_ENV" = "staging" ]; then
              ROOT_DIR="/var/www/virwo-stage/frontend"
              PROJECT_NAME="virwo-stage-frontend"
              ENV_CONTENT="$STAGE_ENV"
            fi

            mkdir -p "$ROOT_DIR"
            sudo chown -R $USER:$USER "$ROOT_DIR" 2>/dev/null || true
            cd "$ROOT_DIR"

            # 1. Write standardized docker-compose.prod.yml on server
            cat << 'EOF' > docker-compose.prod.yml
            services:
              frontend:
                image: ${DOCKER_IMAGE}
                container_name: virwo-frontend
                restart: always
                ports:
                  - "${FRONTEND_PORT:-3090}:3000"
                env_file:
                  - .env
                environment:
                  NODE_ENV: ${NODE_ENV:-production}
                  PORT: ${PORT:-3000}
                  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://virwo.learnica.net/backend}
                networks:
                  - frontend-network

            networks:
              frontend-network:
                name: virwo-frontend-network
                driver: bridge
            EOF

            # 2. Smart Merge .env from GitHub Secret (if provided)
            if [ -n "$ENV_CONTENT" ]; then
              echo "Merging .env file from GitHub Secrets..."
              ENV_CONTENT="$ENV_CONTENT" node -e '
                const fs = require("fs");
                const path = process.argv[1];
                const incoming = process.env.ENV_CONTENT || "";
                
                let lines = [];
                if (fs.existsSync(path)) {
                  lines = fs.readFileSync(path, "utf8").split(/\r?\n/);
                }
                
                const incomingEntries = incoming.split(/\r?\n/)
                  .map(line => line.trim())
                  .filter(line => line && !line.startsWith("#") && line.includes("="));
                
                const incomingMap = new Map();
                for (const entry of incomingEntries) {
                  const idx = entry.indexOf("=");
                  const key = entry.slice(0, idx).trim();
                  const val = entry.slice(idx + 1);
                  if (key) incomingMap.set(key, val);
                }
                
                const updatedKeys = new Set();
                const newLines = lines.map(line => {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed.startsWith("#") || !trimmed.includes("=")) {
                    return line;
                  }
                  const idx = trimmed.indexOf("=");
                  const key = trimmed.slice(0, idx).trim();
                  if (incomingMap.has(key)) {
                    updatedKeys.add(key);
                    return `${key}=${incomingMap.get(key)}`;
                  }
                  return line;
                });
                
                for (const [key, val] of incomingMap.entries()) {
                  if (!updatedKeys.has(key)) {
                    newLines.push(`${key}=${val}`);
                  }
                }
                
                fs.writeFileSync(path, newLines.join("\n").trim() + "\n", { mode: 0o600 });
                console.log("Successfully merged " + incomingMap.size + " environment variables into " + path);
              ' "$ROOT_DIR/.env"
            fi

            # 3. Update DOCKER_IMAGE in .env
            echo "Updating DOCKER_IMAGE in .env..."
            if grep -q "^DOCKER_IMAGE=" "$ROOT_DIR/.env" 2>/dev/null; then
              sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=$IMAGE_NAME|" "$ROOT_DIR/.env"
            else
              echo "DOCKER_IMAGE=$IMAGE_NAME" >> "$ROOT_DIR/.env"
            fi

            # 4. Pull image from GHCR & start container in seconds
            echo "Logging in to GHCR..."
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin 2>/dev/null || true

            echo "Pulling image: $IMAGE_NAME..."
            DOCKER_IMAGE="$IMAGE_NAME" docker compose -p "$PROJECT_NAME" -f docker-compose.prod.yml pull frontend

            echo "Starting containers..."
            DOCKER_IMAGE="$IMAGE_NAME" docker compose -p "$PROJECT_NAME" -f docker-compose.prod.yml up -d --remove-orphans

            # 5. Prune unused images
            echo "Pruning dangling docker images..."
            docker image prune -f

            echo "🎉 Virwo Frontend deployment ($IMAGE_NAME) completed successfully in seconds!"
